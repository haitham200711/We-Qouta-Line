# Redirect HTTP to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME challenge location for auto-renewals
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP traffic to HTTPS on 197.164.101.4.sslip.io
    location / {
        return 301 https://197.164.101.4.sslip.io$request_uri;
    }
}

# HTTPS Server with Valid Let's Encrypt Certificate
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 197.164.101.4.sslip.io 197.164.101.4;

    ssl_certificate /etc/letsencrypt/live/197.164.101.4.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/197.164.101.4.sslip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Client upload size for bulk text files
    client_max_body_size 10M;

    # If accessed directly via raw IP https://197.164.101.4 or other host, redirect immediately to official domain
    if ($host != "197.164.101.4.sslip.io") {
        return 301 https://197.164.101.4.sslip.io$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
